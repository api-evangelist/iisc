  detail: >-
    ePrints@IISc documents an OAI-PMH interface at the standard EPrints path
    https://eprints.iisc.ac.in/cgi/oai2, but the host sits behind an Azure Web Application Firewall
    that returns 403 with an "Azure WAF" HTML body to every automated client tried on 2026-09-01 —
