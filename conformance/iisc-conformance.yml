standards:
- id: shibboleth
  conforms: true
  operator: institution
  evidence: >-
    Institution-operated Shibboleth Identity Provider. GET
    https://libraryidp.iisc.ac.in/idp/shibboleth returns 200 application/xml — a 15,764-byte SAML 2.0
    EntityDescriptor self-published on IISc's own host, entityID
    https://libraryidp.iisc.ac.in/idp/shibboleth, mdui:DisplayName "Indian Institute of Science,
    Bengaluru", shibmd:Scope iisc.ac.in, with IDPSSODescriptor and AttributeAuthorityDescriptor
    roles and protocolSupportEnumeration covering SAML 2.0, SAML 1.1 and urn:mace:shibboleth:1.0.
    GET https://libraryidp.iisc.ac.in/idp/profile/SAML2/Redirect/SSO returns 400 "Web Login Service
    - Stale Request", which is a live Shibboleth IdP correctly rejecting a parameterless
    AuthnRequest; /idp/status returns 403 (access-restricted, i.e. running). The entity is
    registered in the eduGAIN interfederation via INFED, the INFLIBNET Access Management Federation
    (registrationAuthority http://inflibnet.ac.in, federation code INFED, id 672727, first seen
    2020-04-12, sirtfi_status 1, eccs_status 1) and appears 13 times in the eduGAIN aggregate
    https://mds.edugain.org/edugain-v2.xml (93,191,945 bytes, fetched 2026-09-01).
- id: saml
  conforms: true
  operator: institution
  evidence: >-
    SAML 2.0 endpoints published in the IdP's own metadata at
    https://libraryidp.iisc.ac.in/idp/shibboleth — SingleSignOnService on HTTP-POST
    (/idp/profile/SAML2/POST/SSO), HTTP-POST-SimpleSign (/idp/profile/SAML2/POST-SimpleSign/SSO),
    HTTP-Redirect (/idp/profile/SAML2/Redirect/SSO) and the Shibboleth AuthnRequest binding
    (/idp/profile/Shibboleth/SSO); SingleLogoutService on Redirect, POST, POST-SimpleSign and SOAP
    (port 8443); AttributeService for SAML1 and SAML2 SOAP AttributeQuery on port 8443. Exactly one
    IISc entity is present in the eduGAIN aggregate — no second, test or staging entity was found,
    so no placeholder had to be excluded.
- id: oai-pmh
  conforms: true
  operator: institution
  evidence: >-
    Live OAI-PMH 2.0 provider on an IISc host. GET
    https://journal.iisc.ac.in/index.php/iisc/oai?verb=Identify returns 200 text/xml with
    repositoryName "Journal of the Indian Institute of Science", baseURL
    https://journal.iisc.ac.in/index.php/iisc/oai, protocolVersion 2.0, adminEmail
    journal@apc.iisc.ernet.in, earliestDatestamp 2012-12-07T00:50:21Z, deletedRecord persistent,
    granularity YYYY-MM-DDThh:mm:ssZ, gzip/deflate compression, and a toolkit block naming Open
    Journal Systems 3.3.0.22 (Public Knowledge Project). verb=ListMetadataFormats returns 200
    (1,518 bytes) and verb=ListSets returns 200 (51,214 bytes) enumerating real issue sets. The OJS
    software is PKP's; the deployment, the host, the journal and the metadata are IISc's, and no OJS
    contract is saved under this institution. A second OAI-PMH interface is advertised by
    ePrints@IISc at https://eprints.iisc.ac.in/cgi/oai2 but could not be confirmed — see
    conforms_unverified below.
- id: lti
  conforms: true
  operator: institution
  evidence: >-
    IISc runs its own Moodle LMS ("IKEN") at https://courses.iisc.ac.in (200, meta keywords
    "moodle"), and its LTI 1.3 platform surface is publicly reachable. GET
    https://courses.iisc.ac.in/mod/lti/certs.php returns 200 application/json — a live JWKS
    {"keys":[{"kty":"RSA","alg":"RS256","kid":"ffa71c7514f167fc08f4",...}]} — and
    https://courses.iisc.ac.in/mod/lti/auth.php returns 200, i.e. the IMS Global LTI Advantage
    OIDC authorization endpoint and public key set of this Moodle instance are deployed and served
    from the institution's own domain. The Moodle web-services REST endpoint at
    https://courses.iisc.ac.in/webservice/rest/server.php is also live, returning 200
    application/json {"exception":"moodle_exception","errorcode":"invalidtoken"} to a keyless call,
    and /lib/ajax/service.php returns a structured Moodle JSON error — both are token-gated, so no
    LTI or web-service payload could be read without credentials.
