- aid: iisc:eprints-oai
  name: ePrints@IISc OAI-PMH
  x-operator: institution
  description: >-
    ePrints@IISc is the open-access institutional repository of IISc research publications,
    established in 2002 on EPrints software and self-hosted on the institute's own
    eprints.iisc.ac.in domain. It is OAI-compliant and advertises the standard EPrints OAI-PMH
    interface at /cgi/oai2. UNVERIFIABLE, NOT ABSENT — the host sits behind an Azure Web
    Application Firewall which returned 403 with an "Azure WAF" body to every automated client
    tried on 2026-09-01 (Chrome on macOS, Chrome on Windows, Googlebot and bare curl), and the
    Internet Archive's own 2026 captures (2026-01-14, 2026-02-26) also recorded 403. The repository
    remains readable to human browsers; no OAI-PMH response body has ever been read, so this is
    recorded as an unverified surface and is not counted as an OAI-PMH conformance hit.
  humanURL: https://library.iisc.ac.in/
  baseURL: https://eprints.iisc.ac.in/cgi/oai2
