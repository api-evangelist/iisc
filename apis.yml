x-coverage:
  state: covered
  reason: covered
  detail: >-
    Three institution-operated machine surfaces were found and verified live on 2026-09-01, all on
    hosts under IISc's own iisc.ac.in domain — a Shibboleth SAML 2.0 identity provider at
    libraryidp.iisc.ac.in registered in INFED and carried into eduGAIN, an OAI-PMH 2.0 provider on
    the Open Journal Systems instance at journal.iisc.ac.in, and a self-hosted Moodle LMS at
    courses.iisc.ac.in exposing a public LTI 1.3 JWKS and a token-gated web-services REST endpoint.
    Four education-regime domain standards are evidenced from public endpoints — shibboleth, saml,
    oai-pmh and lti — and eight are recorded as not conformant with the negative probe that
    established each. Two repository surfaces are unreadable rather than absent and are reported as
    such rather than deleted: ETD@IISc (DSpace 6) has returned 502 on every path since roughly
    2026-05-16, and ePrints@IISc is 403 behind an Azure WAF to every automated client including the
    Internet Archive. No vendor or tenant relationship was found anywhere on IISc's surface — no
    Figshare, Pure, Ex Libris, Dataverse or Symplectic tenancy exists — so this profile records
    none; every surface here is institution-operated or a registry the institute is registered in
    (ROR 04dese585, Crossref Open Funder Registry 100007780). IISc is not a DataCite or Crossref
    member and no institutional ORCID integration is publicly evidenced. There is no developer
    portal, no llms.txt, no security.txt, no sitemap.xml and no public WordPress REST API
    (iisc.ac.in/wp-json returns 401 rest_not_logged_in); the four DSpace OpenAPIs in this repo were
    written by API Evangelist and are stamped as such. github.com/IISc is a real organisation with
    zero public repositories and has been dropped as a pointer in favour of the three departmental
    orgs that actually publish code.
