aid: iisc
name: Indian Institute of Science Bangalore
x-type: university
x-category: Public Research University
description: >-
  The Indian Institute of Science (IISc) Bangalore, founded 1909, is India's premier
  research-intensive institution — a deemed university, an Institute of Eminence, and ranked
  #211 in the QS World University Rankings 2025. It operates no developer portal, publishes no
  OpenAPI of its own, and this profile does not pretend otherwise. What it does run, on hosts
  under its own iisc.ac.in domain, are three verified institution-operated machine surfaces: a
  Shibboleth SAML 2.0 identity provider at libraryidp.iisc.ac.in registered in the INFLIBNET
  Access Management Federation (INFED) and carried into eduGAIN; an OAI-PMH 2.0 provider on the
  Open Journal Systems instance behind the Journal of the Indian Institute of Science at
  journal.iisc.ac.in; and a self-hosted Moodle LMS at courses.iisc.ac.in whose LTI 1.3 JWKS and
  token-gated web-services REST endpoint are both live. Two older repository surfaces are
  currently unreadable rather than absent — ETD@IISc (DSpace 6) has returned 502 on every path
  since roughly May 2026, and ePrints@IISc sits behind an Azure WAF that 403s every automated
  client including the Internet Archive. IISc is registered in ROR (04dese585) and the Crossref
  Open Funder Registry (100007780) but is not a DataCite or Crossref member. Its public code
  lives in departmental GitHub organisations (val-iisc, csl-iisc, cni-iisc), not in a central
  institutional org — github.com/IISc exists but holds zero public repositories.
