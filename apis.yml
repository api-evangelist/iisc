- aid: iisc:jiisc-oai
  name: Journal of the Indian Institute of Science OAI-PMH
  x-operator: institution
  description: >-
    Live OAI-PMH 2.0 metadata-harvesting provider for the Journal of the Indian Institute of
    Science, served from IISc's own journal.iisc.ac.in host on an Open Journal Systems 3.3.0.22
    (Public Knowledge Project) deployment. Verified live 2026-09-01 — verb=Identify returns 200
    text/xml with repositoryName "Journal of the Indian Institute of Science", adminEmail
    journal@apc.iisc.ernet.in, protocolVersion 2.0, earliestDatestamp 2012-12-07T00:50:21Z,
    deletedRecord persistent, granularity YYYY-MM-DDThh:mm:ssZ and gzip/deflate compression;
    verb=ListMetadataFormats returns 200 and verb=ListSets returns 200 with 51KB of real issue sets.
    The OJS REST API on the same host is closed — /index.php/iisc/api/v1/issues returns 403
    api.403.unauthorized. The OJS software and its contract are PKP's and no OJS spec is saved
    under this institution; the deployment, the host, the journal and the metadata are IISc's.
  humanURL: https://journal.iisc.ac.in/
  baseURL: https://journal.iisc.ac.in/index.php/iisc/oai
