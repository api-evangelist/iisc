apis:
- aid: iisc:eprints-oai
  name: ePrints@IISc OAI-PMH
  description: >-
    ePrints@IISc is the open-access institutional repository of IISc research publications, established
    in 2002 on EPrints software. It is OAI-compliant and exposes an OAI-PMH metadata-harvesting interface
    at the standard EPrints /cgi/oai2 path for indexing and metadata reuse. The repository is publicly
    readable; deposit is restricted to the IISc research community. The live site is fronted by an Azure
    Application Gateway that blocks automated requests, so the OAI endpoint could not be programmatically
    verified during this review.
